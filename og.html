<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Social card · Level Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400..700&display=swap">
<style>
  /* Source for og.png (1200x630). Open at a 1200x630 viewport to re-render. */
  html, body { margin: 0; background: #0a0e1d; }
  .card { width: 1200px; height: 630px; position: relative; overflow: hidden; color: #f1eee3; font-family: "Instrument Sans", system-ui, sans-serif;
    background: radial-gradient(55% 70% at 78% 40%, rgb(58 116 255 / .38), transparent 70%), radial-gradient(35% 45% at 92% 92%, rgb(255 59 82 / .25), transparent 70%), radial-gradient(30% 40% at 62% 6%, rgb(255 194 14 / .22), transparent 70%), #0a0e1d; }
  .eyebrow { position: absolute; left: 72px; top: 64px; font: 500 20px/1 "DM Mono", monospace; letter-spacing: .1em; text-transform: uppercase; display: flex; align-items: center; gap: 16px; }
  .eyebrow i { width: 44px; height: 2px; background: #ffc20e; }
  .eyebrow b { color: #ffc20e; font-weight: 500; }
  h1 { position: absolute; left: 66px; bottom: 142px; margin: 0; font: 800 236px/.8 "Bricolage Grotesque", sans-serif; letter-spacing: -.055em; text-transform: uppercase; font-stretch: 75%; font-variation-settings: "opsz" 96, "wdth" 75; }
  h1 span { display: block; }
  h1 i { font-style: normal; color: #ffc20e; }
  .tag { position: absolute; left: 72px; bottom: 56px; font-size: 30px; color: #cfd5ea; max-width: 520px; line-height: 1.25; }
  .stack { position: absolute; right: 90px; bottom: 70px; width: 420px; }
  .step { position: absolute; right: 0; border-radius: 12px 12px 0 0; }
  .s1 { width: 420px; height: 70px; bottom: 0; background: #d42a40; }
  .s2 { width: 330px; height: 70px; bottom: 70px; background: #d42a40; filter: brightness(1.12); }
  .s3 { width: 240px; height: 70px; bottom: 140px; background: #d42a40; filter: brightness(1.25); }
  .bag { position: absolute; width: 96px; height: 58px; border-radius: 34% 34% 40% 40% / 40% 40% 50% 50%; box-shadow: inset 0 -8px 0 rgb(0 0 0 / .18), inset 0 8px 0 rgb(255 255 255 / .25); }
  .b1 { right: 250px; bottom: 70px; background: #ff3b52; transform: rotate(-6deg); }
  .b2 { right: 170px; bottom: 140px; background: #ff3b52; transform: rotate(5deg); }
  .b3 { right: 90px; bottom: 210px; background: #ffc20e; transform: rotate(-4deg); }
  .pts { position: absolute; right: 70px; top: 90px; text-align: right; font: 500 18px/1 "DM Mono", monospace; letter-spacing: .1em; text-transform: uppercase; color: #cfd5ea; }
  .pts b { display: block; font: 800 150px/.9 "Bricolage Grotesque", sans-serif; letter-spacing: -.05em; color: #ffc20e; margin-top: 8px; font-stretch: 80%; font-variation-settings: "opsz" 96, "wdth" 80; }
  .pole { position: absolute; right: 337px; bottom: 210px; width: 10px; height: 270px; background: #7d86a3; border-radius: 4px; }
  .plat { position: absolute; right: 292px; bottom: 470px; width: 100px; height: 14px; background: #c9cfe3; border-radius: 4px; box-shadow: 0 0 0 3px #ffc20e; }
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow"><i></i>VEX IQ Robotics Competition <b>2026—27</b></div>
  <div class="pts">Alliance score<b>47</b></div>
  <div class="pole"></div><div class="plat"></div>
  <div class="stack"><div class="step s1"></div><div class="step s2"></div><div class="step s3"></div><div class="bag b1"></div><div class="bag b2"></div><div class="bag b3"></div></div>
  <h1><span>Level</span><span>Up<i>.</i></span></h1>
  <div class="tag">The coach's field manual. Scoring, the Match, every rule in plain English.</div>
</div>
</body>
</html>
