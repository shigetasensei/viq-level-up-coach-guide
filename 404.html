  .nf { min-height: 100svh; display: grid; align-content: center; padding: clamp(100px, 18vh, 180px) 0 80px; position: relative; overflow: hidden; isolation: isolate; }
  .nf .num { font: 800 clamp(7rem, 25vw, 19rem)/.74 var(--f-display); letter-spacing: -.07em; color: transparent; background: linear-gradient(180deg, rgb(241 238 227 / .22), rgb(241 238 227 / .03)); -webkit-background-clip: text; background-clip: text; margin: 0; font-stretch: 75%; font-variation-settings: "opsz" 96, "wdth" 75; }

  .nf .row .btn { color: #f1eee3; border-color: rgb(255 255 255 / .38); }

  .drop { position: absolute; right: clamp(24px, 12vw, 200px); top: -80px; width: 92px; height: 74px; border-radius: 34% 34% 40% 40% / 40% 40% 50% 50%; background: var(--blue); box-shadow: inset 0 -10px 0 rgb(0 0 0 / .18), inset 0 10px 0 rgb(255 255 255 / .25); animation: fall 2.6s cubic-bezier(.5, 0, 1, .6) 1 .4s forwards, settle 1.2s var(--ease) 3s both; z-index: 1; }

  .zero { position: absolute; right: clamp(60px, 16vw, 260px); bottom: clamp(120px, 24vh, 260px); font: 800 clamp(2rem, 5vw, 4rem)/1 var(--f-display); color: var(--red); opacity: 0; animation: zero 1.8s var(--ease) 2.9s forwards; z-index: 2; }
  @keyframes fall { 0% { transform: translateY(0) rotate(-24deg); } 100% { transform: translateY(calc(100svh - clamp(60px, 14vh, 150px) - 190px)) rotate(8deg); } }
